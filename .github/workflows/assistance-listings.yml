name: assistance-listings
on:
  schedule:
    - cron: "41 11 * * *"   # daily (runs from the default branch)
  workflow_dispatch:
  push:
    branches: [claude/gillibrand-legislative-research-1a5u07]
    paths: [grants/tools/assistance_listings.py, .github/workflows/assistance-listings.yml]
permissions:
  contents: write
concurrency:
  group: assistance-listings
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python grants/tools/assistance_listings.py
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          SAM_MAX_CALLS: "8"
      - name: Rebuild Funding Finder data
        if: always()
        run: python grants/tools/build_site_data.py || true
      - name: Commit catalog
        if: always()
        run: |
          git config user.name "harvest-bot"; git config user.email "actions@users.noreply.github.com"
          git add grants/data grants/site; git diff --cached --quiet && exit 0
          git commit -m "Update federal assistance listings catalog"
          for i in 1 2 3; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && break; sleep 5; done
