name: grant-sources
on:
  workflow_dispatch:
  push:
    branches: [claude/gillibrand-legislative-research-1a5u07]
    paths: [grants/sources/**, grants/tools/snapshot.py, grants/tools/assistance_listings.py, .github/workflows/grant-sources.yml]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Federal program catalog (SAM.gov Assistance Listings)
        run: mkdir -p grants/data && (python grants/tools/assistance_listings.py 2>&1 | tee grants/data/_catalog_log.txt) || true
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: for f in grants/sources/*.txt; do python grants/tools/snapshot.py "$f"; done
      - name: Commit snapshots
        run: |
          git config user.name "harvest-bot"; git config user.email "actions@users.noreply.github.com"
          git add grants/snapshots grants/data; git diff --cached --quiet && exit 0
          git commit -m "Update grant guide source snapshots"
          for i in 1 2 3; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && break; sleep 5; done
